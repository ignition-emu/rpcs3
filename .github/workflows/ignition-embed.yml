# Builds the Ignition PS3 embed module (rpcs3_ignition) -- no app. macOS arm64
# uploads the bare module (Ignition's scripts/package-ps3-module.py bundles
# it); Linux x86_64 is bundled here, in the image it was built in, by
# .ci/package-ignition-linux.py, and the bundle is then loaded in a clean
# container that has only the system libraries the bundle leaves to the host.
# Windows x64 is built with MSVC from rpcs3.sln, as upstream's releases are
# (static CRT), bundled by .ci/package-ignition-windows.py, then loaded the way
# the host loads it.
#
# On an ignition-v* tag the Linux and Windows bundles built from that tag are
# published to its release (the publish job). macOS is left to
# ignition-release.yml there, whose bundle is published by hand.
name: Ignition embed

on:
  workflow_dispatch:
  push:
    # Path filters apply to branch pushes only; every ignition-v* tag builds.
    branches: ['**']
    tags: ['ignition-v*']
    paths:
      - 'rpcs3/ignition/**'
      - 'rpcs3/Emu/RSX/VK/vkutils/instance.*'
      - '.ci/build-mac.sh'
      - '.ci/build-ignition-linux.sh'
      - '.ci/package-ignition-linux.py'
      - '.ci/package-ignition-windows.py'
      - 'rpcs3.sln'
      - '.github/workflows/ignition-embed.yml'

jobs:
  macos-arm64:
    name: Ignition module (macOS arm64)
    # On a tag, ignition-release.yml builds macOS; building it here too was
    # the double build this workflow once had.
    if: github.ref_type != 'tag'
    runs-on: macos-15
    env:
      CCACHE_DIR: /tmp/ccache_dir
      QT_VER: '6.11.1'
      QT_VER_MAIN: '6'
      LLVM_COMPILER_VER: '22'
      AARCH64: '1'
      RUN_UNIT_TESTS: 'OFF'
      WITH_IGNITION: 'ON'
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Restore Build Ccache
        uses: actions/cache/restore@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-ignition-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-ignition-

      - name: Build module
        run: .ci/build-mac.sh

      - name: Upload module
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_ignition-macos-arm64
          path: build/**/librpcs3_ignition.dylib
          if-no-files-found: warn
          compression-level: 0

  linux-x86_64:
    name: Ignition module (Linux x86_64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      ARTIFACTS: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Restore Build Ccache
        uses: actions/cache/restore@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ignition-embed-linux-ccache-${{ github.run_id }}
          restore-keys: |
            ignition-embed-linux-ccache-
            ignition-standalone-linux-ccache-

      # build-linux.sh's image and toolchain; see .ci/build-ignition-linux.sh.
      - name: Build and bundle module
        run: |
          mkdir -p "$ARTIFACTS" "$CCACHE_DIR"
          docker pull --quiet rpcs3/rpcs3-ci-jammy:2.1
          docker run \
            -v "$PWD":/rpcs3 \
            -v "$CCACHE_DIR":/root/.ccache \
            -v "$ARTIFACTS":/root/artifacts \
            -e ARTDIR=/root/artifacts \
            rpcs3/rpcs3-ci-jammy:2.1 \
            /rpcs3/.ci/build-ignition-linux.sh

      - name: Save Build Ccache
        if: always()
        uses: actions/cache/save@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ignition-embed-linux-ccache-${{ github.run_id }}

      # Load the bundle where nothing but the libraries it leaves to the host
      # is installed: every dependency then resolves from the bundle or fails.
      # Ubuntu 22.04 is the oldest host it claims (glibc 2.35, GCC 12's
      # libstdc++); 24.04 is a current one.
      - name: Load in clean containers
        run: |
          sudo chown -R "$(id -u)" "$ARTIFACTS"
          for image in ubuntu:22.04 ubuntu:24.04; do
            case "$image" in
              ubuntu:22.04) t64="" ;;
              *) t64="t64" ;;
            esac
            docker run --rm -v "$ARTIFACTS":/a:ro -e T64="$t64" "$image" sh -exc '
              apt-get update -q > /dev/null
              apt-get install -y -q --no-install-recommends python3 binutils libvulkan1 libx11-6 libx11-xcb1 \
                libgl1 libegl1 libopengl0 libgbm1 libdrm2 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
                libxext6 libxrender1 libxcb1 libxcb-render0 libxcb-shm0 \
                libasound2$T64 libpulse0 libdbus-1-3 libudev1 libfontconfig1 libfreetype6 \
                libglib2.0-0$T64 libcurl4$T64 libstdc++6 > /dev/null
              grep PRETTY_NAME /etc/os-release
              strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6 | grep "^GLIBCXX_3\.4\.[0-9]*$" | sort -V | tail -1
              ldd /a/bundle/librpcs3_ignition.so | grep -v "=> /a/bundle/" || true
              if ldd /a/bundle/librpcs3_ignition.so | grep "not found"; then exit 1; fi
              python3 -c "import ctypes; m = ctypes.CDLL(\"/a/bundle/librpcs3_ignition.so\"); print(\"ABI\", m.ignition_ps3_abi_version())"
            '
          done
          cat "$ARTIFACTS/bundle/release.json" "$ARTIFACTS/SHA256SUMS"

      - name: Upload module
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_ignition-linux-x86_64
          path: |
            ${{ env.ARTIFACTS }}/librpcs3_ignition-linux-x86_64.zip
            ${{ env.ARTIFACTS }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  windows-x64:
    name: Ignition module (Windows x64)
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    # upstream's Windows_Build (rpcs3.yml): the same toolchain, dependencies
    # and scripts, building the rpcs3_ignition project instead of the app.
    env:
      COMPILER: msvc
      QT_VER_MAIN: '6'
      QT_VER: '6.11.2'
      QT_VER_MSVC: 'msvc2022'
      QT_DATE: '202608131017'
      LLVM_VER: '22.1.8'
      VULKAN_VER: '1.4.341.1'
      VULKAN_SDK_SHA: 'bcf2d75aa9556889ab974858666e20b3655b6055a0db704ccb47279ff33b5bfe'
      CCACHE_SHA: '859141059ac950e1e8cd042c66f842f26b9e3a62a1669a69fe6ba180cb58bbdf'
      CCACHE_BIN_DIR: 'C:\ccache_bin'
      CCACHE_DIR: 'C:\ccache'
      CCACHE_INODECACHE: 'true'
      CCACHE_SLOPPINESS: 'time_macros'
      DEPS_CACHE_DIR: ./dependency_cache
      ARTIFACTS: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Restore NuGet packages
        run: nuget restore rpcs3.sln

      - name: Setup env
        shell: pwsh
        run: |
          echo "QTDIR=C:\Qt\${{ env.QT_VER }}\${{ env.QT_VER_MSVC }}_64" >> ${{ github.env }}
          echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_VER }}" >> ${{ github.env }}

      - name: Get Cache Keys
        run: .ci/get_keys-windows.sh

      - name: Restore Build Ccache
        uses: actions/cache/restore@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ignition-embed-windows-msvc-ccache-${{ github.run_id }}
          restore-keys: |
            ignition-embed-windows-msvc-ccache-
            ignition-standalone-windows-ccache-

      - name: Restore Dependencies Cache
        uses: actions/cache/restore@main
        id: restore-dependencies-cache
        with:
          path: ${{ env.DEPS_CACHE_DIR }}
          key: "ignition-windows-deps-${{ env.QT_VER }}-${{ env.VULKAN_SDK_SHA }}-${{ env.CCACHE_SHA }}-${{ hashFiles('llvm.lock') }}"
          restore-keys: ignition-standalone-windows-deps-

      # upstream's setup-windows-ci-vars.sh is not run: it names the app's
      # archive and records a repository origin this build leaves unset.
      - name: Download and unpack dependencies
        run: .ci/setup-windows.sh

      - name: Save Dependencies Cache
        if: steps.restore-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@main
        with:
          path: ${{ env.DEPS_CACHE_DIR }}
          key: ${{ steps.restore-dependencies-cache.outputs.cache-primary-key }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@main

      - name: Compile module
        shell: pwsh
        run: msbuild rpcs3.sln /t:rpcs3_ignition /p:Configuration=Release /v:minimal /p:Platform=x64 /p:PreferredToolArchitecture=x64 /p:CLToolPath=${{ env.CCACHE_BIN_DIR }} /p:UseMultiToolTask=true /p:CustomAfterMicrosoftCommonTargets="${{ github.workspace }}\buildfiles\msvc\ci_only.targets"

      - name: Save Build Ccache
        if: always()
        uses: actions/cache/save@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ignition-embed-windows-msvc-ccache-${{ github.run_id }}

      - name: Bundle module
        run: |
          python -m pip install --quiet pefile
          python .ci/package-ignition-windows.py bin/ignition/rpcs3_ignition.dll "$ARTIFACTS/bundle" \
            --source-root . --search "$QTDIR/bin" --search 3rdparty/opencv/opencv/opencv414/build/x64/bin

      # LoadLibraryEx with the DLL's own directory searched (and the system's,
      # not PATH): how rpcs3-host loads it.
      - name: Load as the host does
        shell: pwsh
        run: |
          $dll = "${{ github.workspace }}\artifacts\bundle\rpcs3_ignition.dll"
          python -c "import ctypes, sys; m = ctypes.WinDLL(sys.argv[1], winmode=0x1100); print('ABI', m.ignition_ps3_abi_version())" $dll
          Get-Content "${{ github.workspace }}\artifacts\bundle\release.json"

      - name: Upload module
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_ignition-windows-x64
          path: |
            artifacts/rpcs3_ignition-windows-x64.zip
            artifacts/SHA256SUMS-windows
          if-no-files-found: error
          compression-level: 0

  # On an ignition-v* tag: attach the two bundles built above from the tag to
  # its release, creating the release if the tag has none. Only these names
  # are uploaded and nothing is clobbered, so a macOS bundle published by hand
  # (librpcs3_ignition.dylib.zip) is never touched, and a re-run fails rather
  # than replace an asset already there.
  publish:
    name: Publish to the tag's release
    if: github.ref_type == 'tag'
    needs: [linux-x86_64, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download bundles
        uses: actions/download-artifact@main
        with:
          path: dist
          merge-multiple: true

      - name: Release
        run: |
          cd dist
          ls -l
          linux=librpcs3_ignition-linux-x86_64.zip
          windows=rpcs3_ignition-windows-x64.zip
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS-windows
          cat SHA256SUMS SHA256SUMS-windows > SHA256SUMS-embed
          linux_sha=$(sha256sum "$linux" | cut -d' ' -f1)
          windows_sha=$(sha256sum "$windows" | cut -d' ' -f1)
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat > notes.md <<NOTES
          The Ignition PS3 embed module (ABI from \`rpcs3/ignition/ignition_ps3.h\`) for Linux x86_64 and Windows x64, built by CI from $TAG (${{ github.sha }}) in run $run.

          - \`$linux\` sha256 \`$linux_sha\`: loads on Ubuntu 22.04 and newer (glibc 2.35, GCC 12's libstdc++); see bundle.json for the libraries left to the host.
          - \`$windows\` sha256 \`$windows_sha\`: MSVC, static CRT; the Vulkan loader is the system's.

          Each archive carries release.json (source commit, input module checksum), bundle.json and the licences of everything bundled. The macOS module is not part of this release.
          NOTES
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" "$linux" "$windows" SHA256SUMS-embed
