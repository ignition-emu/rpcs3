# Builds the Ignition PS3 embed module (rpcs3_ignition) -- no app. macOS arm64
# uploads the bare module (Ignition's scripts/package-ps3-module.py bundles
# it); Linux x86_64 is bundled here, in the image it was built in, by
# .ci/package-ignition-linux.py, and the bundle is then loaded in a clean
# container that has only the system libraries the bundle leaves to the host.
name: Ignition embed

on:
  workflow_dispatch:
  push:
    # Branches only: an ignition-v* tag push is the release workflow's job, and
    # without this it matched here too and double-built the module.
    branches: ['**']
    paths:
      - 'rpcs3/ignition/**'
      - 'rpcs3/Emu/RSX/VK/vkutils/instance.*'
      - '.ci/build-mac.sh'
      - '.ci/build-ignition-linux.sh'
      - '.ci/package-ignition-linux.py'
      - '.github/workflows/ignition-embed.yml'

jobs:
  macos-arm64:
    name: Ignition module (macOS arm64)
    runs-on: macos-15
    env:
      CCACHE_DIR: /tmp/ccache_dir
      QT_VER: '6.11.1'
      QT_VER_MAIN: '6'
      LLVM_COMPILER_VER: '22'
      AARCH64: '1'
      RUN_UNIT_TESTS: 'OFF'
      WITH_IGNITION: 'ON'
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Restore Build Ccache
        uses: actions/cache/restore@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-ignition-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-ignition-

      - name: Build module
        run: .ci/build-mac.sh

      - name: Upload module
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_ignition-macos-arm64
          path: build/**/librpcs3_ignition.dylib
          if-no-files-found: warn
          compression-level: 0

  linux-x86_64:
    name: Ignition module (Linux x86_64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      ARTIFACTS: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Restore Build Ccache
        uses: actions/cache/restore@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ignition-embed-linux-ccache-${{ github.run_id }}
          restore-keys: |
            ignition-embed-linux-ccache-
            ignition-standalone-linux-ccache-

      # build-linux.sh's image and toolchain; see .ci/build-ignition-linux.sh.
      - name: Build and bundle module
        run: |
          mkdir -p "$ARTIFACTS" "$CCACHE_DIR"
          docker pull --quiet rpcs3/rpcs3-ci-jammy:2.1
          docker run \
            -v "$PWD":/rpcs3 \
            -v "$CCACHE_DIR":/root/.ccache \
            -v "$ARTIFACTS":/root/artifacts \
            -e ARTDIR=/root/artifacts \
            rpcs3/rpcs3-ci-jammy:2.1 \
            /rpcs3/.ci/build-ignition-linux.sh

      - name: Save Build Ccache
        if: always()
        uses: actions/cache/save@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ignition-embed-linux-ccache-${{ github.run_id }}

      # Load the bundle where nothing but the libraries it leaves to the host
      # is installed: every dependency then resolves from the bundle or fails.
      - name: Load in a clean container
        run: |
          sudo chown -R "$(id -u)" "$ARTIFACTS"
          docker run --rm -v "$ARTIFACTS":/a:ro ubuntu:24.04 sh -exc '
            apt-get update -q > /dev/null
            apt-get install -y -q --no-install-recommends python3 libvulkan1 libx11-6 libx11-xcb1 \
              libgl1 libegl1 libgbm1 libdrm2 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
              libasound2t64 libpulse0 libdbus-1-3 libudev1 libfontconfig1 libfreetype6 \
              libglib2.0-0t64 libcurl4t64 > /dev/null
            ldd /a/bundle/librpcs3_ignition.so | grep -v "=> /a/bundle/" || true
            if ldd /a/bundle/librpcs3_ignition.so | grep "not found"; then exit 1; fi
            python3 -c "import ctypes; m = ctypes.CDLL(\"/a/bundle/librpcs3_ignition.so\"); print(\"ABI\", m.ignition_ps3_abi_version())"
          '
          cat "$ARTIFACTS/bundle/release.json" "$ARTIFACTS/SHA256SUMS"

      - name: Upload module
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_ignition-linux-x86_64
          path: |
            ${{ env.ARTIFACTS }}/librpcs3_ignition-linux-x86_64.zip
            ${{ env.ARTIFACTS }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
